name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
            bun_target: bun-darwin-arm64
            asset: pigeon-darwin-arm64
          - runner: macos-latest
            target: darwin-x64
            bun_target: bun-darwin-x64
            asset: pigeon-darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
            bun_target: bun-linux-x64
            asset: pigeon-linux-x64
          - runner: ubuntu-22.04
            target: linux-arm64
            bun_target: bun-linux-arm64
            asset: pigeon-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client PWA
        run: bun run build:client

      - name: Compile standalone binary
        run: bun build --compile --minify ./src/cli/index.ts --target=${{ matrix.bun_target }} --outfile dist/pigeon

      - name: Package archive
        run: |
          mkdir -p .local/release/pigeon-${{ matrix.target }}
          cp dist/pigeon .local/release/pigeon-${{ matrix.target }}/pigeon
          tar -C .local/release/pigeon-${{ matrix.target }} \
            -czf .local/release/pigeon-${{ matrix.target }}/${{ matrix.asset }}.tar.gz pigeon

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-${{ matrix.target }}
          path: .local/release/pigeon-${{ matrix.target }}/${{ matrix.asset }}.tar.gz

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if .github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            echo "::warning::No CHANGELOG section for ${GITHUB_REF_NAME}; using generated notes."
            gh release create "${GITHUB_REF_NAME}" dist/*/*.tar.gz \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # npm Trusted Publishing: `npm publish` trades this run's OIDC token for
    # publish rights, so no npm token is stored anywhere (distribution.md §5).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Assemble packages
        run: |
          node npm/scripts/build-packages.mjs \
            --version "${GITHUB_REF_NAME#v}" \
            --artifacts dist \
            --out .local/npm-dist

      - name: Publish to npm
        run: node npm/scripts/publish-packages.mjs .local/npm-dist
