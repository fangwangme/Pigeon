<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background squircle -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="#282828" stroke="#665C54" stroke-width="12" />

  <!-- Back wing (deep Gruvbox orange, tucked cleanly behind dorsal ridge 236,198 -> 304,212) -->
  <path d="M 204 224 L 290 84 L 304 212 L 236 218 Z" fill="#D65D0E" />

  <!-- Seamless under-silhouette to prevent anti-aliasing background bleed across fold lines -->
  <path d="M 60 312 L 116 284 L 164 250 L 236 198 L 304 212 L 364 152 L 396 174 L 342 264 L 330 342 L 224 402 L 138 342 L 82 358 Z" fill="#D5C4A1" />

  <!-- Tail facets -->
  <path d="M 60 312 L 138 342 L 82 358 Z" fill="#7C6F64" />
  <path d="M 60 312 L 116 284 L 138 342 Z" fill="#928374" />

  <!-- Body facets -->
  <path d="M 116 284 L 138 342 L 224 402 Z" fill="#BDAE93" />
  <path d="M 116 284 L 224 402 L 342 264 L 304 212 L 236 198 L 164 250 Z" fill="#D5C4A1" />
  <path d="M 224 402 L 330 342 L 342 264 Z" fill="#E2D3B3" />

  <!-- Neck & head facet -->
  <path d="M 304 212 L 364 152 L 396 174 L 342 264 Z" fill="#EBDBB2" />

  <!-- Beak (shares exact front head edge 396,174 -> 378,204) -->
  <path d="M 396 174 L 444 188 L 378 204 Z" fill="#FABD2F" />

  <!-- Front wing (bright Gruvbox orange, shares dorsal crease 164,250 -> 228,296) -->
  <path d="M 164 250 L 244 94 L 228 296 Z" fill="#FE8019" />

  <!-- Eye -->
  <circle cx="364" cy="182" r="10" fill="#282828" />
  <circle cx="366" cy="180" r="4" fill="#FE8019" />

  <!-- Envelope -->
  <rect x="380" y="212" width="76" height="50" rx="6" fill="#8EC07C" />
  <path d="M 382 214 L 418 240 L 454 214" fill="none" stroke="#282828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
