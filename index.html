<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0B0F14" />
    <title>Pigeon — Mobile Remote for Herdr</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overflow-y: hidden;
        touch-action: pan-y;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Ensure minimum 44px touch target rule */
      .touch-target {
        min-height: 44px;
        min-width: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      /* Feed is a scrolling column: never let its children collapse to fit.
         Without this, cards with overflow:hidden shrink to a few pixels. */
      .pigeon-feed > * {
        flex: 0 0 auto;
        min-height: 0;
      }
      .pigeon-feed {
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      .pigeon-feed::-webkit-scrollbar,
      .pigeon-scroll::-webkit-scrollbar {
        display: none;
      }
      .pigeon-scroll {
        scrollbar-width: none;
      }
      button {
        font-family: inherit;
      }
      button:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--selb);
        color: var(--fg);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/src/index.tsx"></script>
  </body>
</html>
